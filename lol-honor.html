<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的数据 · 英雄联盟</title>
<!-- 唯一外部依赖：ECharts 官方 CDN（jsdelivr），无本地构建 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="lol-honor.css">
</head>
<body>

<div class="my-wrap">

  <header class="my-head">
    <a class="my-back" href="index.html">← 返回冉星</a>
    <h1>我的数据</h1>
    <span class="my-region" id="myRegion">未设置</span>
  </header>

  <!-- 账号概览 -->
  <section class="my-card my-profile">
    <div class="my-avatar" id="myAvatar">L</div>
    <div class="my-id">
      <div class="my-name" id="myName">未设置召唤师</div>
      <div class="my-sub" id="mySub">—</div>
    </div>
    <div class="my-ranks">
      <div class="my-rank">
        <span class="my-rank-label">LOL</span>
        <span class="my-rank-value" id="myLolRank">待核实</span>
      </div>
      <div class="my-rank">
        <span class="my-rank-label">LOLM</span>
        <span class="my-rank-value" id="myLolmRank">待核实</span>
      </div>
    </div>
  </section>

  <!-- 总览四格 -->
  <section class="my-stats" id="myStats"></section>

  <div class="my-grid">

    <!-- 八维雷达：未接入真实数据前 value 留空 -->
    <section class="my-card">
      <h2 class="my-card-title">能力雷达<span class="my-note">八维 · 待接入</span></h2>
      <div class="my-radar" id="myRadar"></div>
      <p class="my-tip">数据源未接入，仅渲染坐标框架；接入后填 series.data 的 value 即可。</p>
    </section>

    <!-- 模式分布 -->
    <section class="my-card">
      <h2 class="my-card-title">模式分布<span class="my-note" id="myModeTotal"></span></h2>
      <div class="my-modes" id="myModes"></div>
    </section>

  </div>

  <!-- 全部战绩 -->
  <section class="my-card">
    <h2 class="my-card-title">全部战绩<span class="my-note" id="myMatchCount"></span></h2>
    <div class="my-matches" id="myMatches"></div>
  </section>

  <div class="my-foot">
    本页读取本机存档（localStorage · novarise_lol_profile），不联网取数；英雄名等无法确证的字段不显示。
  </div>

</div>

<script src="lol-honor.js"></script>
</body>
</html>
