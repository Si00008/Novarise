<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业选手查询 · 冉星</title>
<link rel="stylesheet" href="style.css">
<style>
  .pro-page {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .pro-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .pro-back {
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--bg);
    transition: color .16s ease, border-color .16s ease;
  }

  .pro-back:hover { color: var(--primary); border-color: var(--primary); }

  .pro-head h1 {
    margin: 0;
    font-size: 20px;
    color: var(--text);
  }

  .pro-head .pro-hint {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .pro-search {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .pro-search input {
    flex: 1 1 260px;
    min-height: 44px;
    padding: 0 14px;
    font-size: 14px;
    color: var(--text);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color .16s ease;
  }

  .pro-search input:focus { border-color: var(--primary); }

  .pro-search .btn { min-height: 44px; }

  .pro-tip {
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .pro-results {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 26px;
  }

  .pro-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .pro-avatar {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), #3d7ea6);
  }

  .pro-info { flex: 1 1 auto; min-width: 0; }

  .pro-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .pro-meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pro-pending { color: var(--warning, #c98a1f); }

  .pro-fav-btn {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 0 14px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-secondary);
    transition: all .16s ease;
  }

  .pro-fav-btn:hover { border-color: var(--primary); color: var(--primary); }

  .pro-fav-btn.is-fav {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
  }

  .pro-empty {
    padding: 26px 14px;
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .pro-fav-sec h2 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--text);
  }

  .pro-fav-sec h2 span {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 400;
    margin-left: 6px;
  }

  .pro-foot {
    margin-top: 28px;
    padding-top: 14px;
    font-size: 11px;
    line-height: 1.7;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 560px) {
    .pro-card { flex-wrap: wrap; }
    .pro-fav-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="pro-page">

  <div class="pro-head">
    <a class="pro-back" href="index.html">← 返回冉星</a>
    <h1>职业选手查询</h1>
    <span class="pro-hint">基础档案已核实 · 战绩未接入</span>
  </div>

  <div class="pro-search">
    <input id="proSearchInput" type="search" autocomplete="off" spellcheck="false"
           placeholder="输入选手名 / 战队 / 位置，例如 Faker、T1、中单">
    <button type="button" class="btn" id="proSearchBtn">搜索</button>
    <button type="button" class="btn btn-ghost" id="proClearBtn">清空</button>
  </div>

  <p class="pro-tip">
    需按名字、战队或位置搜索才会出结果；战队与位置来自官方战队页 / 战队官宣，查不到的字段显示「待核实」。
    收藏后会写进你本机的 LOL 存档，和「我的数据」共用一份 localStorage。
  </p>

  <div id="proResults" class="pro-results"></div>
  <div id="proEmpty" class="pro-empty" hidden>没有匹配的选手，换个关键词试试</div>

  <section class="pro-fav-sec">
    <h2>我的收藏 <span id="favCount">0</span></h2>
    <div id="proFavList" class="pro-results"></div>
    <div id="favEmpty" class="pro-empty">还没有收藏，搜索结果里点「收藏」即可</div>
  </section>

  <div class="pro-foot">
    本页为纯静态查询，不联网取数。选手基础档案核实时间：2026-11（官方战队页 / 战队官宣 / 权威电竞资料站）。
  </div>

</div>

<script src="lol-pro.js"></script>
</body>
</html>
